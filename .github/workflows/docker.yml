name: Docker Build & Smoke

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build images with cache
        run: docker compose build --pull

      - name: Save Docker images
        run: |
          docker save $(docker compose config --images | tr '\n' ' ') | gzip > docker-images.tar.gz

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images.tar.gz
          retention-days: 1

      - name: Start containers
        run: docker compose up -d

      - name: Show container status
        run: docker compose ps

      - name: Wait for database
        run: |
          echo "Waiting for database to be ready..."
          timeout 60 bash -c 'until docker compose exec -T codeface-db mysqladmin ping -h localhost -uroot -proot --silent 2>/dev/null; do sleep 2; done'
          echo "Database is ready!"

      - name: Smoke test (Shiny on :8081)
        shell: bash
        run: |
          set -e
          echo "Waiting for Shiny (http://localhost:8081) ..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8081 > /dev/null 2>&1; then
              echo "Shiny Server is accessible!"
              # Verify it's actually Shiny content
              if curl -fsS http://localhost:8081 | grep -qi "shiny\|R\|dashboard"; then
                echo "✅ Shiny Server verified!"
                exit 0
              fi
            fi
            echo "  not ready yet ($i/30) ..."
            sleep 5
          done
          echo "Shiny did not become ready in time."
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose down -v
