name: Docker Build & Smoke

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Show container status
        run: docker compose ps

      - name: Smoke test (Shiny on :8081)
        shell: bash
        run: |
          set -e
          echo "Waiting for Shiny (http://localhost:8081) ..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8081 >/dev/null; then
              echo "Shiny Server is accessible!"
              exit 0
            fi
            echo "  not ready yet ($i/30) ..."
            sleep 5
          done
          echo "Shiny did not become ready in time."
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose down -v
