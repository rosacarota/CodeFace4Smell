name: Docker Build & Smoke

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (GHA cache)
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t codeface4smell:ci \
            -f Dockerfile \
            .

      - name: Create compose override for CI
        run: |
          cat > docker-compose.ci.yml <<'YAML'
          services:
            codeface-app:
              image: codeface4smell:ci
            codeface-shiny:
              image: codeface4smell:ci
          YAML

      - name: Start DB + App (avoid r-libs race)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build codeface-db codeface-app

      - name: Show container status
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

      - name: Wait for database
        run: |
          echo "Waiting for database to be ready..."
          timeout 60 bash -c 'until docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T codeface-db mysqladmin ping -h localhost -uroot -proot --silent 2>/dev/null; do sleep 2; done'
          echo "Database is ready!"

      - name: Start Shiny (after DB+App)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build codeface-shiny

      - name: Smoke test (Shiny on :8081)
        shell: bash
        run: |
          set -e
          echo "Waiting for Shiny (http://localhost:8081) ..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8081 > /dev/null 2>&1; then
              if curl -fsS http://localhost:8081 | grep -qi "shiny\|R\|dashboard"; then
                echo "✅ Shiny Server verified!"
                exit 0
              fi
            fi
            echo "  not ready yet ($i/30) ..."
            sleep 5
          done
          echo "Shiny did not become ready in time."
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
