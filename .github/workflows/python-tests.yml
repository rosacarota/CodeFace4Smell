name: Python Tests

on:
  workflow_run:
    workflows: ["Docker Build & Smoke"]
    types: [completed]

concurrency:
  group: pytests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (same commit as Docker workflow)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (GHA cache)
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t codeface4smell:ci \
            -f Dockerfile \
            .

      - name: Create compose override for CI
        run: |
          cat > docker-compose.ci.yml <<'YAML'
          services:
            codeface-app:
              image: codeface4smell:ci
            codeface-shiny:
              image: codeface4smell:ci
          YAML

      - name: Start containers
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build

      - name: Wait for database
        run: |
          echo "Waiting for database to be ready..."
          timeout 60 bash -c 'until docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T codeface-db mysqladmin ping -h localhost -uroot -proot --silent 2>/dev/null; do sleep 2; done'
          echo "Database is ready!"

      - name: Wait for codeface-app
        run: |
          echo "Waiting for codeface-app to be ready..."
          timeout 60 bash -c 'until docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T codeface-app python3 -c "import codeface" 2>/dev/null; do sleep 2; done'
          echo "Codeface app is ready!"

      - name: Run Python unit tests
        run: |
          echo "Running Python unit tests..."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T codeface-app pytest codeface/test/unit/ -v --tb=short

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color codeface-app || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
