name: Python Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Start containers
      run: docker-compose up -d
    
    - name: Wait for services
      run: sleep 30
    
    - name: Run Python unit tests
      run: |
        docker-compose exec -T codeface-app pytest codeface/test/unit/ -v --tb=short
    
    - name: Show logs on failure
      if: failure()
      run: docker-compose logs codeface-app
    
    - name: Cleanup
      if: always()
      run: docker-compose down -v
