name: Python Tests

on:
  workflow_run:
    workflows: ["Docker Build & Smoke"]
    types: [completed]

concurrency:
  group: pytests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start containers
        run: docker compose up -d

      - name: Wait for services (simple)
        run: sleep 20

      - name: Run Python unit tests
        run: docker compose exec -T codeface-app pytest codeface/test/unit/ -v --tb=short

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color codeface-app || true

      - name: Cleanup
        if: always()
        run: docker compose down -v
