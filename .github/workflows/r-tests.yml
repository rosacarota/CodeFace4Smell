name: R Tests

on:
  workflow_run:
    workflows: ["Docker Build & Smoke"]
    types: [completed]

concurrency:
  group: rtests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker images
        run: |
          docker load < docker-images.tar.gz
          docker images

      - name: Start containers
        run: docker compose up -d

      - name: Wait for database
        run: |
          echo "Waiting for database to be ready..."
          timeout 60 bash -c 'until docker compose exec -T codeface-db mysqladmin ping -h localhost -uroot -proot --silent 2>/dev/null; do sleep 2; done'
          echo "Database is ready!"

      - name: Wait for codeface-app
        run: |
          echo "Waiting for codeface-app to be ready..."
          timeout 30 bash -c 'until docker compose exec -T codeface-app Rscript -e "library(methods)" 2>/dev/null; do sleep 2; done'
          echo "Codeface app is ready!"

      - name: Run R utility tests
        id: test-utils
        continue-on-error: true
        run: |
          echo "Running R utility tests..."
          docker compose exec -T codeface-app Rscript -e "source('codeface/R/test_utils.r')"

      - name: Run R developer classification tests
        id: test-dev-class
        continue-on-error: true
        run: |
          echo "Running R developer classification tests..."
          docker compose exec -T codeface-app Rscript -e "source('codeface/R/test_developer_classification.r')"

      - name: Run R breadcrumb tests
        id: test-breadcrumb
        continue-on-error: true
        run: |
          echo "Running R breadcrumb tests..."
          docker compose exec -T codeface-app Rscript -e "source('codeface/R/test_breadcrumb.r')"

      - name: Test Results Summary
        if: always()
        run: |
          echo "=== R Test Results Summary ==="
          echo "Utility tests: ${{ steps.test-utils.outcome }}"
          echo "Developer classification tests: ${{ steps.test-dev-class.outcome }}"
          echo "Breadcrumb tests: ${{ steps.test-breadcrumb.outcome }}"
          
          if [[ "${{ steps.test-utils.outcome }}" == "failure" ]] || \
             [[ "${{ steps.test-dev-class.outcome }}" == "failure" ]] || \
             [[ "${{ steps.test-breadcrumb.outcome }}" == "failure" ]]; then
            echo "Some tests failed"
            exit 1
          else
            echo "All tests passed"
          fi

      - name: Logs on failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose ps || true
          echo "=== Codeface App Logs ==="
          docker compose logs --no-color codeface-app || true

      - name: Cleanup
        if: always()
        run: docker compose down -v
